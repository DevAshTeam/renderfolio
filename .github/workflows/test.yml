name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - README.md
      - LICENSE
  #pull_request:
    #branches: [master]
  workflow_dispatch:

jobs:
  test:
    name: unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  build-push-image:
    name: Build Docker image
    needs: [test]
    permissions:
      contents: read
      packages: write
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
        
      - name: Log into GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log into Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{vars.IMAGE_NAME}}:v1.0.0
            ghcr.io/${{vars.IMAGE_NAME}}:latest
            docker.io/${{vars.IMAGE_NAME}}:v1.0.0
            docker.io/${{vars.IMAGE_NAME}}:latest

  test-builded-image:
    name: Testing the image
    needs: [test,build-push-image]
    runs-on: ubuntu-latest
    
    steps:
      - name: Log into GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ vars.REGISTRY_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Smoke test — CLI entrypoint
        run: docker run --rm ghcr.io/${{ vars.IMAGE_NAME }} --help

      - name: Run full test suite inside the image
        run: docker run --rm --entrypoint sh ghcr.io/${{ vars.IMAGE_NAME }} -c "cd /app && npm test"
          
