<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Renderfolio — Web Studio</title>
<style>
  :root {
    --bg: #0e1116; --panel: #161b23; --panel2: #1c232e;
    --border: #263041; --text: #e6e9ef; --muted: #8b95a7; --accent: #7aa2f7;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; background: var(--bg);
         color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  header { display: flex; align-items: baseline; gap: 12px; padding: 14px 20px;
           border-bottom: 1px solid var(--border); }
  header .gh { margin-left: auto; color: var(--muted); text-decoration: none; font-size: 13px; }
  header .gh:hover { color: var(--accent); }
  header h1 { font-size: 17px; letter-spacing: .3px; }
  header h1 span { color: var(--accent); }
  header .sub { color: var(--muted); font-size: 12.5px; }
  .layout { flex: 1; display: grid; grid-template-columns: 400px 1fr; min-height: 0; }
  aside { border-right: 1px solid var(--border); background: var(--panel); overflow-y: auto; padding: 18px; }
  main { position: relative; background: #20242c; }
  iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }

  label { display: block; font-size: 11.5px; font-weight: 600; color: var(--muted);
          text-transform: uppercase; letter-spacing: .07em; margin: 16px 0 6px; }
  input[type=text], textarea { width: 100%; background: var(--panel2); border: 1px solid var(--border);
          color: var(--text); border-radius: 8px; padding: 9px 11px; font-size: 14px; outline: none; }
  input:focus, textarea:focus { border-color: var(--accent); }
  textarea { font-family: ui-monospace, 'Cascadia Code', Consolas, monospace; font-size: 13px;
             line-height: 1.55; min-height: 280px; resize: vertical; }

  .themes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .theme-btn { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 6px;
          background: var(--panel2); border: 1px solid var(--border); border-radius: 10px;
          color: var(--text); cursor: pointer; font-size: 12.5px; }
  .theme-btn:hover { border-color: var(--muted); }
  .theme-btn.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,.18); }

  .social-row { display: grid; grid-template-columns: 105px 1fr 28px; gap: 8px; margin-bottom: 8px; }
  .social-row button { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 15px; }
  .social-row button:hover { color: #e06c75; }

  .actions { display: grid; gap: 8px; margin-top: 22px; }
  .btn { padding: 10px 12px; border-radius: 8px; border: 1px solid var(--border);
         background: var(--panel2); color: var(--text); font-size: 14px; cursor: pointer; }
  .btn:hover { border-color: var(--muted); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #0c1424; font-weight: 600; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }

  .hint { font-size: 11.5px; color: var(--muted); margin-top: 6px; line-height: 1.5; }
  .hint .link { color: var(--accent); cursor: pointer; text-decoration: underline; }
  code { background: var(--panel2); padding: 1px 4px; border-radius: 4px; font-size: 11px; }

  #toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%) translateY(90px);
           background: #1f2a3a; border: 1px solid var(--border); padding: 10px 16px; border-radius: 10px;
           font-size: 13.5px; transition: transform .25s ease; max-width: 90vw; }
  #toast.show { transform: translateX(-50%) translateY(0); }

  @media (max-width: 860px) {
    body { overflow: auto; height: auto; }
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); }
    main { height: 70vh; }
  }
</style>
</head>
<body>
<header>
  <h1>render<span>folio</span></h1>
  <div class="sub">web studio</div>
  <a class="gh" href="https://github.com/DevAshTeam/renderfolio" target="_blank" rel="noopener">GitHub ↗</a>
</header>

<div class="layout">
  <aside>
    <label for="name">Name</label>
    <input id="name" type="text" value="John Doe" placeholder="Jane Doe">

    <label for="title">Title / subtitle</label>
    <input id="title" type="text" value="Full-Stack Developer">

    <label>Social links</label>
    <div id="socialRows"></div>
    <button class="btn" id="addLink" type="button" style="width:100%">+ Add link</button>

    <label for="content">Portfolio content (Markdown)</label>
    <textarea id="content" spellcheck="false"></textarea>
    <div class="hint">## sections become portfolio sections·
      Or <span class="link" id="uploadLink">upload an .md file</span>.</div>
    <input id="upload" type="file" accept=".md,.markdown" hidden>

    <label>Theme</label>
    <div class="themes" id="themes"></div>

    <div class="actions">
      <button class="btn primary" id="dlHtml">⬇ Download HTML</button>
      <button class="btn" id="dlPdf">⬇ Download resume PDF</button>
      <button class="btn" id="dlMd">⬇ Download .md</button>
    </div>
    <div class="hint" id="pdfHint" hidden>PDF unavailable here — no Chromium found.</div>
  </aside>

  <main>
    <iframe id="preview" title="Portfolio preview"
            sandbox="allow-popups allow-popups-to-escape-sandbox"></iframe>
  </main>
</div>

<div id="toast"></div>

<script>
  const $ = (s) => document.querySelector(s);
  const THEMES = [
    { id: 'noir',     colors: ['#111214', '#c9cdd6'] },
    { id: 'terminal', colors: ['#0a0f0a', '#2fbf71'] },
    { id: 'slate',    colors: ['#232833', '#94a3b8'] },
    { id: 'paper',    colors: ['#f4efe4', '#3b3226'] },
    { id: 'rose',     colors: ['#2a1d24', '#f2a6c0'] },
    { id: 'forge',    colors: ['#1c1613', '#f08c3a'] },
  ];
  let theme = 'noir';

  // ---------- helpers ----------
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g,
    (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

  function toast(msg, ok = true) {
    const t = $('#toast');
    t.textContent = msg;
    t.style.borderColor = ok ? '' : '#e06c75';
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), 3500);
  }

  async function api(path, body) {
    const res = await fetch(path, {
      method: body === undefined ? 'GET' : 'POST',
      headers: body === undefined ? {} : { 'Content-Type': 'application/json' },
      body: body === undefined ? undefined : JSON.stringify(body),
    });
    if (!res.ok) {
      let msg = res.statusText;
      try { msg = (await res.json()).error || msg; } catch {}
      throw new Error(msg);
    }
    return res;
  }

  function triggerDownload(blob, filename) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
  }

  const fileBase = () =>
    ($('#name').value || 'portfolio').toLowerCase().trim().replace(/\s+/g, '_') || 'portfolio';

  // ---------- form state ----------
  function collect() {
    const social = [...document.querySelectorAll('.social-row')].map((row) => ({
      label: row.querySelector('.s-label').value.trim(),
      url: row.querySelector('.s-url').value.trim(),
    })).filter((s) => s.label || s.url);
    return { name: $('#name').value, title: $('#title').value,
             content: $('#content').value, social, theme };
  }

  function addSocialRow(label = '', url = '') {
    const row = document.createElement('div');
    row.className = 'social-row';
    row.innerHTML =
      `<input class="s-label" type="text" placeholder="GitHub" value="${esc(label)}">` +
      `<input class="s-url" type="text" placeholder="https://github.com/you" value="${esc(url)}">` +
      `<button type="button" title="Remove">✕</button>`;
    row.querySelector('button').onclick = () => { row.remove(); schedule(); };
    row.querySelectorAll('input').forEach((i) => i.addEventListener('input', schedule));
    $('#socialRows').appendChild(row);
  }

  // ---------- live preview ----------
  async function refresh() {
    try {
      const res = await api('/api/render', collect());
      $('#preview').srcdoc = await res.text();
    } catch (e) {
      toast('Render failed: ' + e.message, false);
    }
  }
  const schedule = debounce(refresh, 500);

  // ---------- theme picker ----------
  for (const t of THEMES) {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'theme-btn' + (t.id === theme ? ' active' : '');
    b.innerHTML = `<span class="swatch" style="background:linear-gradient(135deg,${t.colors[0]} 50%,${t.colors[1]} 50%)"></span>${t.id}`;
    b.onclick = () => {
      theme = t.id;
      document.querySelectorAll('.theme-btn').forEach((x) => x.classList.remove('active'));
      b.classList.add('active');
      refresh();
    };
    $('#themes').appendChild(b);
  }

  // ---------- actions ----------
  $('#addLink').onclick = () => addSocialRow();

  $('#dlHtml').onclick = async () => {
    try {
      triggerDownload(await (await api('/api/render', collect())).blob(),
        `${fileBase()}_portfolio.html`);
      toast('HTML downloaded');
    } catch (e) { toast(e.message, false); }
  };

  $('#dlPdf').onclick = async () => {
    try {
      triggerDownload(await (await api('/api/pdf', collect())).blob(),
        `${fileBase()}_resume.pdf`);
      toast('PDF downloaded');
    } catch (e) { toast(e.message, false); }
  };

  $('#dlMd').onclick = () => {
    const { name, title, social, content } = collect();
    let fm = `---\nname: "${name}"\ntitle: "${title}"\n`;
    if (social.length) {
      fm += 'social:\n';
      for (const s of social) fm += `  - label: ${s.label}\n    url: ${s.url}\n`;
    }
    triggerDownload(new Blob([fm + '---\n\n' + content], { type: 'text/markdown' }),
      `${fileBase()}_portfolio.md`);
    toast('.md downloaded — drop it into portfolio/ to continue with the CLI');
  };

  $('#uploadLink').onclick = () => $('#upload').click();
  $('#upload').onchange = async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      const d = await (await api('/api/parse', { raw: await f.text() })).json();
      if (d.name) $('#name').value = d.name;
      if (d.title) $('#title').value = d.title;
      $('#content').value = d.content || '';
      $('#socialRows').innerHTML = '';
      (d.social && d.social.length ? d.social : [{}]).forEach((s) => addSocialRow(s.label, s.url));
      refresh();
      toast('Loaded ' + f.name);
    } catch (err) { toast(err.message, false); }
    e.target.value = '';
  };

  // ---------- init ----------
  (async () => {
    $('#content').value = `## About

Hi! I'm a developer who likes clean tools and boring technology.

## Skills

- JavaScript / TypeScript
- Node.js
- Docker & DevOps
- PostgreSQL / Redis

## Projects

### File Server

A simple, fast, zero-config file server.
[GitHub](https://github.com/you/file-server) · [Live Demo](https://demo.you.dev)

### Personal Blog

I write about backend architecture and databases.
[Visit](https://blog.you.dev)`;

    addSocialRow('GitHub', 'https://github.com/yourusername');
    addSocialRow('LinkedIn', 'https://linkedin.com/in/yourusername');

    ['name', 'title', 'content'].forEach((id) =>
      $('#' + id).addEventListener('input', schedule));

    try {
      const caps = await (await fetch('/api/capabilities')).json();
      if (!caps.pdf) { $('#dlPdf').disabled = true; $('#pdfHint').hidden = false; }
    } catch {}

    refresh();
  })();
</script>
</body>
</html>
